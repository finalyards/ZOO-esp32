[package]
name = "ble-custom"
edition = "2024"
rust-version = "1.89"
publish = false

[profile.release]
debug = 2
#debug-assertions = true     # since we .. kind-of only live in the 'release'
#codegen-units = 1      # LLVM can perform better optimizations using a single thread
#opt-level     = "s"     # optimize for binary size, but keep loop vectorization enabled
#lto           = "thin"  # "can produce better optimized code, using whole-program analysis, at the cost of longer linking time."
                        #   - thin: "similar to “fat”, but takes substantially less time to run [...]"

# Even when not having a library, optional crates must be under 'dependencies'.
[dependencies]
defmt           = { version = "1.0.1", optional = true }
esp-hal         = { version = "1.0.0-rc.1", features = ["requires-unstable"] }
palette         = { version = "0.7.6", default-features = false, features = ["libm", "named"] }

[dev-dependencies]
#bt-hci          = { version = "0.6.0", features = [] }  # "defmt"
defmt-rtt       = { version = "1.1.0" }
embassy-executor = { version = "0.9.1", features = [] } # "defmt"
embassy-futures = { version = "0.1.2", features = [] }  # "defmt"
embassy-sync    = { version = "0.7.2", features = [] }  # "defmt"
embassy-time    = { version = "0.5.0", features = ["generic-queue-8", "defmt-timestamp-uptime-us"]} # "defmt"

esp-alloc       = { version = "0.9.0", features = [] }  # "defmt"
esp-backtrace   = { version = "0.18.0", features = ["panic-handler", "esp32c3"] }   # "defmt"
esp-bootloader-esp-idf = { version = "0.3.0", features = ["esp32c3"] }  # "defmt"
esp-hal         = { version = "1.0.0-rc.1", features = ["unstable", "esp32c3"] }    # "defmt"
esp-radio       = { version = "0.16.0", features = [ "ble", "unstable", "esp32c3" ] }   # "defmt"
esp-rtos        = { version = "0.1.1", features = ["embassy", "esp-radio", "esp-alloc", "esp32c3"] }  # "defmt"

static_assertions = "1.1.0"

#rand_core       = { version = "0.6", default-features = false }
    # follow the version in 'trouble': 0.6 (now), or 0.9 (future)
#static_cell     = { version = "2" }     # trouble-host-macros?
trouble-host    = { version = "0.5.0", default-features = false, features = [
    "default-packet-pool-mtu-255",  # as in the 'trouble' ESP32 examples
    "derive",
    "gatt",
    "peripheral",
    "security",
] } # "defmt"

[build-dependencies]
anyhow          = { version = "1.0", default-features = false }
serde           = { version = "1.0", features = ["derive"] }
toml            = "0.9"

[features]
defmt = ["dep:defmt",
    #"bt-hci/defmt",
    "embassy-executor/defmt",
    "embassy-futures/defmt",
    "embassy-sync/defmt",
    "esp-alloc/defmt",
    "esp-backtrace/defmt",
    "esp-bootloader-esp-idf/defmt",
    "esp-hal/defmt",
    "esp-radio/defmt",
    "esp-rtos/defmt",
    "trouble-host/defmt"
]

#|[patch.crates-io]
#|esp-alloc =             { git = "https://github.com/esp-rs/esp-hal.git" }
#|esp-backtrace =         { git = "https://github.com/esp-rs/esp-hal.git" }
#|esp-bootloader-esp-idf ={ git = "https://github.com/esp-rs/esp-hal.git" }
#|esp-hal =               { git = "https://github.com/esp-rs/esp-hal.git" }
#|esp-radio =             { git = "https://github.com/esp-rs/esp-hal.git" }
#|esp-rtos =              { git = "https://github.com/esp-rs/esp-hal.git" }

#trouble-host =          { path = "../../../trouble/host" }

# Having 'required-features' stops compilation, in case some features wouldn't be declared.
#
[[example]]
name = "custom-emb"
required-features = ["defmt"]
